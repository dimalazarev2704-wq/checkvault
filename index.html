<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CheckVault</title>
<style>
:root{--ink:#1b2a2f;--bg:#eef2f1;--panel:#fff;--line:#cfd9d6;--accent:#1f6f5c;--warn:#b3402a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ink:#e6efed;--bg:#121b1d;--panel:#1a2528;--line:#2f4045;--accent:#4fb59b;--warn:#e38a76;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:20px 16px 60px;display:grid;gap:20px}
h1{margin:0;font-size:1.6rem}h2{margin:0 0 12px;font-size:1.1rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label{display:grid;gap:4px;font-size:.9rem}
input{font:inherit;padding:9px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.wide{grid-column:1/-1}
button{font:inherit;padding:10px 16px;border-radius:6px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--warn);border:1px solid var(--line)}
button:disabled{opacity:.6}
#msg{min-height:1.4em;margin:0}
.bar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:180px}
.list{display:grid;gap:12px}
.check{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.check img{width:120px;height:64px;object-fit:cover;border-radius:4px;background:var(--line);cursor:zoom-in}
.check b{font-size:1.05rem}.muted{opacity:.7;font-size:.9rem}
dialog{max-width:95vw;padding:8px;border:0;border-radius:8px}dialog img{max-width:100%;max-height:85vh}
@media (max-width:560px){.check{grid-template-columns:90px 1fr}.check img{width:90px}.check .actions{grid-column:1/-1}}
</style>
</head>
<body>
<main>
  <div class="bar"><h1>CheckVault</h1><button class="ghost" style="color:inherit" id="out">Sign out</button></div>

  <section class="panel">
    <h2>Add a check</h2>
    <form id="form">
      <label>Front of check<input type="file" name="front" accept="image/*" capture="environment" required></label>
      <label>Back of check (optional)<input type="file" name="back" accept="image/*" capture="environment"></label>
      <label>Date<input type="date" name="date" required></label>
      <label>Payee<input name="payee" required></label>
      <label>Amount ($)<input name="amount" type="number" step="0.01" min="0" required></label>
      <label>Check number<input name="check_number"></label>
      <label class="wide">Memo<input name="memo"></label>
      <div class="wide bar"><p id="msg" role="status"></p><button id="save">Save check</button></div>
    </form>
  </section>

  <section class="panel">
    <div class="bar">
      <h2>Saved checks</h2>
      <input id="q" type="search" placeholder="Search payee, amount, check number" aria-label="Search checks">
      <span id="total" class="muted"></span>
    </div>
    <div id="list" class="list"></div>
  </section>
</main>
<dialog id="viewer"><img alt="Check image"></dialog>

<script>
const $ = s => document.querySelector(s);
const _fetch = fetch;
window.fetch = async (...a) => { const r = await _fetch(...a); if (r.status === 401 && !a[0].startsWith("/login")) location = "/login"; return r; };
let checks = [];
const money = n => n.toLocaleString(undefined, {style: "currency", currency: "USD"});
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function load() {
  const r = await fetch("/api/checks");
  checks = r.ok ? await r.json() : [];
  render();
}

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const rows = checks.filter(c => !q || [c.payee, c.check_number, c.memo, String(c.amount)].join(" ").toLowerCase().includes(q));
  $("#total").textContent = rows.length ? `${rows.length} checks, ${money(rows.reduce((t, c) => t + c.amount, 0))}` : "";
  $("#list").innerHTML = rows.length ? rows.map(c => `
    <article class="check">
      <img src="/api/checks/${c.id}/thumb" alt="Front of check to ${esc(c.payee)}" data-id="${c.id}" data-side="front">
      <div><b>${esc(c.payee)}</b> ${money(c.amount)}<br>
        <span class="muted">${c.date}${c.check_number ? " · #" + esc(c.check_number) : ""}${c.memo ? " · " + esc(c.memo) : ""}</span></div>
      <div class="actions">
        ${c.has_back ? `<button class="ghost" style="color:inherit" data-id="${c.id}" data-side="back">View back</button>` : ""}
        <button class="ghost" data-del="${c.id}">Delete</button>
      </div>
    </article>`).join("") : `<p class="muted">${checks.length ? "No checks match that search." : "No checks yet. Add your first one above."}</p>`;
}

$("#q").addEventListener("input", render);
$("#out").addEventListener("click", async () => { await fetch("/logout", {method: "POST"}); location = "/login"; });

$("#list").addEventListener("click", async e => {
  const t = e.target;
  if (t.dataset.side) { $("#viewer img").src = `/api/checks/${t.dataset.id}/${t.dataset.side}`; $("#viewer").showModal(); }
  if (t.dataset.del && confirm("Delete this check and its images? This can't be undone.")) {
    await fetch(`/api/checks/${t.dataset.del}`, {method: "DELETE"});
    load();
  }
});
$("#viewer").addEventListener("click", () => $("#viewer").close());

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  if (!fd.get("back").size) fd.delete("back");
  $("#save").disabled = true; $("#msg").textContent = "Encrypting and uploading...";
  try {
    const r = await fetch("/api/checks", {method: "POST", body: fd});
    if (!r.ok) throw new Error((await r.json()).detail || "Upload failed");
    e.target.reset(); $("#msg").textContent = "Check saved.";
    load();
  } catch (err) { $("#msg").textContent = "Could not save: " + err.message; }
  $("#save").disabled = false;
});

$("#form").date.valueAsDate = new Date();
load();
</script>
</body>
</html>
