<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CheckVault</title>
<script src="/device.js"></script>
<script>try{var _e=sessionStorage.getItem("cv-enter");if(_e){var _p=_e.split(","),_h=document.documentElement;_h.classList.add("enter");_h.style.setProperty("--vx",_p[0]+"%");_h.style.setProperty("--vy",_p[1]+"%");sessionStorage.removeItem("cv-enter");setTimeout(function(){_h.classList.remove("enter")},1800)}}catch(x){}</script>
<script>(function(){var h=document.documentElement;function f(){h.classList.toggle("compact",h.getAttribute("data-device")==="phone"||innerWidth<=760)}f();addEventListener("resize",f);addEventListener("cv-device",f)})()</script>
<style>
:root{--desk:#e9edf2;--paper:#fff;--ink:#1b2330;--mute:#5b6675;--line:#cdd4de;--pen:#2a5bd7;--mark:#ffe14d;--red:#c0392b;--on:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--desk:#1c2331;--paper:#262f40;--ink:#e6ebf3;--mute:#9aa6b8;--line:#37425a;--pen:#86a8ff;--mark:#f0d54a;--red:#ff8c7a;--on:#14203a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{margin:0;font-size:1.4rem;font-weight:700;letter-spacing:-.01em}
h2{margin:34px 0 12px;font-size:1.1rem;font-weight:700}
p{margin:0}.mute{color:var(--mute)}.mute:empty{display:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
button:disabled{opacity:.6}
[hidden]{display:none!important}
mark{background:var(--mark);color:#1b2330;border-radius:2px;padding:0 1px}

/* top bar */
.top{display:flex;align-items:center;gap:26px;padding:14px 28px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.sp{flex:1}
nav{display:flex;gap:22px}
nav button{background:none;border:0;padding:8px 2px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--pen)}
.btn{background:var(--pen);color:var(--on);border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer}
.ghost{background:none;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer}
.lnk{background:none;border:0;padding:4px 0;font-size:.88rem;color:var(--pen);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lnk.red{color:var(--red)}
main{max-width:1040px;margin:0 auto;padding:26px 28px 70px}
.foot{margin-top:40px;text-align:center}

/* log out: the runner heads for the door, the door shuts behind him, and he drops out the bottom */
.lo{position:relative;z-index:6;display:inline-flex;align-items:center;gap:12px;padding:9px 12px 9px 16px;border:0;border-radius:8px;background:var(--ink);color:var(--desk);font-weight:600;cursor:pointer}
.lo .ic{width:34px;height:26px;overflow:visible;flex:none}
.lo .gap{fill:#0a1124}
.lo .leaf{fill:#3b6cf0}
.lo .door{transform-box:fill-box;transform-origin:100% 50%}
.lo .door circle{fill:#0a1124}
.lo .lines path{fill:none;stroke:#8aa4f7;stroke-width:1.5;stroke-linecap:round;opacity:0}
.lo .p2{opacity:0}
.lo .fall{position:absolute;right:24px;top:100%;width:22px;height:22px;overflow:visible;opacity:0;pointer-events:none}
.lo.go{pointer-events:none;animation:loWobble .45s .5s both}
.lo.go .man{animation:loRun .55s ease-in both}
.lo.go .p1{animation:loA .17s steps(1) infinite}
.lo.go .p2{animation:loB .17s steps(1) infinite}
.lo.go .door{animation:loDoor .9s ease-in-out both}
.lo.go .lines path{animation:loLines .9s both}
.lo.go .fall{animation:loDrop .7s .62s cubic-bezier(.4,0,.8,1) both}
@keyframes loRun{0%{transform:translateX(0);opacity:1}70%{transform:translateX(13px);opacity:1}100%{transform:translateX(17px) scale(.7);opacity:0}}
@keyframes loA{0%{opacity:1}50%{opacity:0}}
@keyframes loB{0%{opacity:0}50%{opacity:1}}
@keyframes loDoor{0%,30%{transform:scaleX(1)}45%,60%{transform:scaleX(.28)}80%,100%{transform:scaleX(1)}}
@keyframes loLines{0%,55%{opacity:0}66%{opacity:1}100%{opacity:0}}
@keyframes loWobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-2.5deg)}40%{transform:rotate(2deg)}60%{transform:rotate(-1.2deg)}80%{transform:rotate(.6deg)}}
@keyframes loDrop{0%{opacity:0;transform:translate(0,-14px) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(8px,46px) rotate(330deg)}}

/* overview */
.lead{margin:14px 0 4px;font-size:clamp(1.7rem,4.6vw,2.6rem);font-weight:800;letter-spacing:-.025em;line-height:1.15}
.strip{display:flex;gap:18px;overflow-x:auto;padding:2px 2px 14px}
.strip .tile{flex:0 0 150px}
.mrow{display:grid;grid-template-columns:3rem 1fr 6.5rem;gap:14px;align-items:center;padding:6px 0}
.mrow b{text-align:right;font-variant-numeric:tabular-nums}
.trk{display:block;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.trk i{display:block;height:100%;border-radius:5px;background:var(--mute)}.trk i.cur{background:var(--pen)}
.srow{display:grid;grid-template-columns:1fr auto 7rem;gap:14px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}.srow b{text-align:right;font-variant-numeric:tabular-nums}

/* receipt tiles: the photo, torn along the bottom like the paper it came from */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:26px 20px}
.wall .none{grid-column:1/-1}
.tile{display:flex;flex-direction:column;gap:3px;min-width:0}
.ph{aspect-ratio:3/4;margin-bottom:8px;filter:drop-shadow(0 2px 3px rgba(20,30,50,.25))}
.ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;background:var(--line);border-radius:3px 3px 0 0;cursor:zoom-in;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%}
.lg{position:relative;flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;overflow:hidden;background:hsl(var(--h,210) 38% 40%);color:#fff;font-size:.78rem;font-weight:700;line-height:1}
.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2px;background:#fff;opacity:0}
.lg.has{background:#fff;color:transparent}.lg.has img{opacity:1}
.t-top{display:flex;align-items:center;gap:8px;min-width:0}
.withlogo{position:relative;display:block}.withlogo input{width:100%;padding-left:42px}
.withlogo .lg{position:absolute;left:9px;top:50%;margin-top:-12px}
.t-store{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-amt{font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.t-date{color:var(--mute);font-size:.88rem}
.t-note{color:var(--mute);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-acts{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px}
.mini{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.mini:first-of-type{border-top:0}
.mini img{width:44px;height:58px;object-fit:cover;object-position:top;border-radius:2px;background:var(--line);cursor:zoom-in}
.mini .t-amt{font-size:1.05rem}

/* add receipt */
.new{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 22px 22px}
.new h2{margin-top:16px}
#form,#eform{display:grid;gap:16px 18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
#form label,#eform label{display:grid;gap:5px;font-weight:600;font-size:.92rem}
#edit{width:min(92vw,540px);padding:20px}
#pk{width:min(92vw,520px);padding:20px}
.pkrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.pkadd{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 6px}.pkadd input{flex:1;min-width:180px}
.wide{grid-column:1/-1}
.pick{display:grid;gap:6px;align-content:start}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input{font:inherit;font-weight:400;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--desk);color:inherit;min-width:0}
input[type=file]{padding:8px;font-size:.9rem}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.listbar{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin:34px 0 18px}.listbar h2{margin:0}
#q{flex:1;min-width:200px;max-width:380px;background:var(--paper)}
#total{font-variant-numeric:tabular-nums}

/* calendar */
.calwrap{display:grid;grid-template-columns:1fr 300px;gap:34px}
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}.calhead h2{margin:0 auto 0 8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal.head{margin-bottom:4px}.cal.head span{text-align:center;font-size:.85rem;color:var(--mute)}
.day{min-height:60px;padding:6px 7px;border:1px solid var(--line);border-radius:4px;background:var(--paper);text-align:left;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.day.has{background:color-mix(in srgb,var(--pen) 13%,var(--paper))}
.day small{color:var(--mute);font-size:.74rem;font-variant-numeric:tabular-nums;min-height:1em}
.day.sel{outline:2px solid var(--pen);outline-offset:1px}
.day .mk{background:var(--mark);color:#1b2330;border-radius:3px;padding:0 5px;align-self:flex-start;font-weight:700}

dialog{max-width:95vw;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,22,.72)}
dialog img{max-width:100%;max-height:85vh;display:block}
#cam video{width:min(92vw,520px);max-height:70vh;background:#000;border-radius:6px;display:block}
.camacts{display:flex;gap:10px;justify-content:center;margin-top:12px}

/* small screens and phones: tabs move to the bottom */
html.compact .top{padding:12px 16px;gap:12px}
html.compact .lo{padding:8px 10px 8px 12px;gap:8px;font-size:.92rem}
html.compact .lo .ic{width:30px}
html.compact nav{position:fixed;left:0;right:0;bottom:0;z-index:5;gap:0;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
html.compact nav button{flex:1;padding:15px 4px;border-bottom:0;border-top:2px solid transparent}
html.compact nav button.on{border-top-color:var(--pen)}
html.compact main{padding:20px 16px 100px}
html.compact .calwrap{grid-template-columns:1fr;gap:10px}
html.compact .wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 16px}
html.compact .new{padding:4px 16px 18px}
html[data-input=touch] button,html[data-input=touch] input{min-height:44px}

#veil{position:fixed;inset:0;background:var(--desk);z-index:50;pointer-events:none;opacity:0}
html.enter #veil{opacity:1;animation:veil .95s .1s cubic-bezier(.65,0,.35,1) forwards}
@keyframes veil{from{clip-path:circle(150vmax at var(--vx,50%) var(--vy,45%))}to{clip-path:circle(0 at var(--vx,50%) var(--vy,45%))}}
.fade{animation:fade .3s ease both}
html.enter .fade{animation-delay:.6s}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#veil{display:none!important}}
</style>
</head>
<body>
<header class="top">
  <span class="brand">CheckVault</span>
  <nav id="nav" aria-label="Main"></nav>
  <span class="sp"></span>
  <button class="btn" data-go="checks">Add receipt</button>
  <button class="lo" id="out" type="button"><span>Log out</span>
    <svg class="ic" viewBox="0 0 34 26" aria-hidden="true">
      <rect class="gap" x="22" y="1" width="11" height="24" rx="1.5"/>
      <g class="door"><rect class="leaf" x="22" y="1" width="11" height="24" rx="1.5"/><circle cx="25.4" cy="13" r="1"/></g>
      <g class="lines"><path d="M15 9h4M14 13h5M15 17h4"/></g>
      <g class="man" fill="none" stroke="#3b6cf0" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9.5" cy="5" r="2.5" fill="#3b6cf0" stroke="none"/>
        <path d="M9 9l-1.5 6"/>
        <g class="p1"><path d="M7.5 15l-3.5 6M7.5 15l4 4.5l.5 3"/><path d="M9 10l-3.5 3M9 10l5 1.5"/></g>
        <g class="p2"><path d="M7.5 15l3.5 6M7.5 15l-3.5 3.5l-2 1.5"/><path d="M9 10l4 3M9 10l-4.5 1"/></g>
      </g>
    </svg>
    <svg class="fall" viewBox="0 0 22 22" aria-hidden="true" fill="none" stroke="#3b6cf0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="7" cy="6" r="2.2" fill="#3b6cf0" stroke="none"/><path d="M8 8.5l5 4M13 12.5l5-3M13 12.5l2 6M9.5 10.5l-5 1M10 10l4-3.5"/>
    </svg>
  </button>
</header>
<main>
  <h1 id="h1"></h1><p id="sub" class="mute"></p>
  <div id="view"></div>
  <p class="foot"><button class="lnk" id="pkbtn" type="button" hidden>Passkeys</button> <button class="lnk" id="devbtn" type="button">Layout</button></p>
</main>
<div id="veil"></div>
<dialog id="viewer"><img alt="Receipt image"></dialog>
<dialog id="pk"><div>
  <h2 style="margin:0 0 6px">Passkeys</h2>
  <p class="mute" style="margin-bottom:10px">Sign in with Face ID, a fingerprint or your device PIN instead of typing. Your password and code still work.</p>
  <div id="pklist"></div>
  <div class="pkadd"><input id="pkname" maxlength="40" placeholder="Name it, like Dad's iPhone" aria-label="Passkey name"><button class="btn" id="pkadd" type="button">Add a passkey</button></div>
  <p id="pkmsg" class="mute" role="status"></p>
  <div class="camacts"><button class="ghost" id="pkclose" type="button">Close</button></div>
</div></dialog>
<dialog id="edit"><form id="eform">
  <h2 style="margin:0 0 4px;grid-column:1/-1">Edit receipt</h2>
  <label>Date<input type="date" name="date" required></label>
  <label>Store<input name="payee" maxlength="100" required></label>
  <label>Total ($)<input name="amount" type="number" step="0.01" min="0" required></label>
  <label>Receipt number (optional)<input name="check_number" maxlength="30"></label>
  <label class="wide">Notes<input name="memo" maxlength="200"></label>
  <div class="wide bar2"><p id="emsg" class="mute" role="status"></p><span class="acts"><button type="button" class="ghost" id="ecancel">Cancel</button><button class="btn" id="esave">Save changes</button></span></div>
</form></dialog>
<dialog id="cam"><video id="vid" autoplay playsinline muted></video><p id="camerr" class="mute" role="alert"></p>
  <div class="camacts"><button class="btn" id="snap">Take photo</button><button class="ghost" id="camx">Cancel</button></div></dialog>

<script>
const $ = s => document.querySelector(s);
const _fetch = fetch;
window.fetch = async (...a) => { const r = await _fetch(...a); if (r.status === 401 && !String(a[0]).startsWith("/login")) location = "/login"; return r; };
const money = n => n.toLocaleString(undefined, {style: "currency", currency: "USD"});
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hl = (s, q) => { s = String(s); const i = q ? s.toLowerCase().indexOf(q) : -1; return i < 0 ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + q.length)) + "</mark>" + esc(s.slice(i + q.length)); };
const pad = n => String(n).padStart(2, "0");
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const sum = a => a.reduce((t, c) => t + c.amount, 0);
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const TITLES = {overview: ["Overview", ""], checks: ["Receipts", ""], calendar: ["Calendar", ""]};
const LABEL = {overview: "Overview", checks: "Receipts", calendar: "Calendar"};

const now = new Date(), today = fmt(now);
let checks = [], view = "overview", cal = {y: now.getFullYear(), m: now.getMonth()}, sel = today;

const hue = s => { let h = 0; for (const ch of String(s).trim().toLowerCase()) h = (h * 31 + ch.codePointAt(0)) % 360; return h; };
const badgeInner = name => `${esc(([...String(name).trim()][0] || "?").toUpperCase())}<img class="logo" src="/api/logo?store=${encodeURIComponent(String(name).trim().slice(0, 100))}&v=2" alt="" loading="lazy">`;
const badge = name => `<span class="lg" style="--h:${hue(name)}">${badgeInner(name)}</span>`;
const noteHtml = (c, q) => (c.check_number ? "No. " + hl(c.check_number, q) + (c.memo ? "<br>" : "") : "") + (c.memo ? hl(c.memo, q) : "");
const tile = (c, del, q = "") => `<article class="tile" data-cid="${c.id}">
  <div class="ph"><img src="/api/checks/${c.id}/thumb" alt="Receipt from ${esc(c.payee)}" data-id="${c.id}" data-side="front" loading="lazy"></div>
  <div class="t-top">${badge(c.payee)}<div class="t-store">${hl(c.payee, q)}</div></div>
  <div class="t-amt">${money(c.amount)}</div>
  <div class="t-date">${c.date}</div>
  ${c.check_number || c.memo ? `<div class="t-note">${noteHtml(c, q)}</div>` : ""}
  ${c.has_back || del ? `<div class="t-acts">${c.has_back ? `<button class="lnk" data-id="${c.id}" data-side="back">2nd photo</button>` : ""}${del ? `<button class="lnk" data-edit="${c.id}">Edit</button>` : ""}${del && c.has_back ? `<button class="lnk red" data-delback="${c.id}">Delete 2nd photo</button>` : ""}${del ? `<button class="lnk red" data-del="${c.id}">Delete</button>` : ""}</div>` : ""}
</article>`;

const mini = c => `<article class="mini">
  <img src="/api/checks/${c.id}/thumb" alt="Receipt from ${esc(c.payee)}" data-id="${c.id}" data-side="front" loading="lazy">
  <div><div class="t-top">${badge(c.payee)}<div class="t-store">${esc(c.payee)}</div></div><div class="t-date">${c.date}</div></div>
  <div class="t-amt">${money(c.amount)}</div>
</article>`;

function viewOverview() {
  const key = today.slice(0, 7), prevKey = fmt(new Date(now.getFullYear(), now.getMonth() - 1, 1)).slice(0, 7);
  const thisM = checks.filter(c => c.date.startsWith(key)), lastM = checks.filter(c => c.date.startsWith(prevKey));
  if (!checks.length) {
    $("#view").innerHTML = `<p class="lead">No receipts yet.</p><p class="mute">Photograph one after your next purchase.</p><p style="margin-top:18px"><button class="btn" data-go="checks">Add receipt</button></p>`;
    return;
  }
  const months = [...Array(6)].map((_, i) => {
    const d = new Date(now.getFullYear(), now.getMonth() - 5 + i, 1);
    return {label: MONTHS[d.getMonth()].slice(0, 3), total: sum(checks.filter(c => c.date.startsWith(fmt(d).slice(0, 7)))), cur: i === 5};
  });
  const max = Math.max(...months.map(m => m.total), 1);
  const by = {};
  checks.forEach(c => { const k = c.payee.trim().toLowerCase(); by[k] = by[k] || {name: c.payee, total: 0, n: 0}; by[k].total += c.amount; by[k].n++; });
  const top = Object.values(by).sort((a, b) => b.total - a.total).slice(0, 5);
  $("#view").innerHTML = `
  <p class="lead">${money(sum(thisM))} spent this month.</p>
  <p class="mute">${plural(thisM.length, "receipt")} so far. Last month: ${money(sum(lastM))} from ${plural(lastM.length, "receipt")}.</p>
  <section><h2>Latest receipts</h2><div class="strip">${checks.slice(0, 8).map(c => tile(c, false)).join("")}</div></section>
  <section><h2>Month by month</h2>${months.map(m => `<div class="mrow"><span>${m.label}</span><span class="trk"><i class="${m.cur ? "cur" : ""}" style="width:${m.total ? Math.max(2, m.total / max * 100) : 0}%"></i></span><b>${money(m.total)}</b></div>`).join("")}</section>
  <section><h2>Stores</h2>${top.map(p => `<div class="srow"><span class="t-top">${badge(p.name)}<span>${esc(p.name)}</span></span><span class="mute">${plural(p.n, "receipt")}</span><b>${money(p.total)}</b></div>`).join("")}</section>`;
}

function viewChecks() {
  $("#view").innerHTML = `
  <section class="new"><h2>New receipt</h2>
    <form id="form">
      <div class="pick"><label for="f-front">Photo of the receipt</label><input id="f-front" type="file" name="front" accept="image/*" required>
        <div class="acts"><button type="button" class="ghost" data-cam="front">Use camera</button><span class="mute" id="ok-front"></span></div></div>
      <div class="pick"><label for="f-back">Second photo, for a long receipt (optional)</label><input id="f-back" type="file" name="back" accept="image/*">
        <div class="acts"><button type="button" class="ghost" data-cam="back">Use camera</button><span class="mute" id="ok-back"></span></div></div>
      <label>Date<input type="date" name="date" required></label>
      <label>Store<span class="withlogo"><span class="lg" id="lg-prev" hidden></span><input name="payee" maxlength="100" required></span></label>
      <label>Total ($)<input name="amount" type="number" step="0.01" min="0" required></label>
      <label>Receipt number (optional)<input name="check_number" maxlength="30"></label>
      <label class="wide">Notes<input name="memo" maxlength="200"></label>
      <div class="wide bar2"><p id="msg" class="mute" role="status"></p><button class="btn" id="save">Save receipt</button></div>
    </form></section>
  <div class="listbar"><h2>Saved receipts</h2><input id="q" type="search" placeholder="Search store, total, receipt number, notes" aria-label="Search receipts"><span id="total" class="mute"></span></div>
  <div id="list" class="wall"></div>`;
  $("#form").elements.date.value = today;
  buildWall();
}

// The wall is built once per load. Searching only hides and shows tiles that are already there, so no photo is fetched again.
function buildWall() {
  $("#list").innerHTML = checks.length
    ? checks.map(c => tile(c, true)).join("") + '<p class="mute none" id="nomatch" hidden>No receipts match that search.</p>'
    : '<p class="mute none">No receipts yet. Add your first one above.</p>';
  list();
}

function list() {
  const q = ($("#q") ? $("#q").value : "").trim().toLowerCase(), byId = {};
  checks.forEach(c => byId[c.id] = c);
  let n = 0, total = 0;
  document.querySelectorAll("#list .tile").forEach(el => {
    const c = byId[el.dataset.cid];
    if (!c) return;
    const hit = !q || [c.payee, c.check_number, c.memo, String(c.amount)].join(" ").toLowerCase().includes(q);
    el.hidden = !hit;
    if (!hit) return;
    n++; total += c.amount;
    el.querySelector(".t-store").innerHTML = hl(c.payee, q);
    const note = el.querySelector(".t-note");
    if (note) note.innerHTML = noteHtml(c, q);
  });
  if ($("#nomatch")) $("#nomatch").hidden = n > 0;
  $("#total").textContent = n ? `${plural(n, "receipt")}, ${money(total)}` : "";
}

function viewCalendar() {
  const {y, m} = cal, key = `${y}-${pad(m + 1)}`;
  const lead = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  const cnt = {}, tot = {}; checks.forEach(c => { cnt[c.date] = (cnt[c.date] || 0) + 1; tot[c.date] = (tot[c.date] || 0) + c.amount; });
  let cells = "<span></span>".repeat(lead);
  for (let d = 1; d <= days; d++) {
    const k = `${key}-${pad(d)}`, n = cnt[k] || 0;
    cells += `<button class="day${n ? " has" : ""}${k === sel ? " sel" : ""}" data-day="${k}" aria-label="${k}: ${plural(n, "receipt")}">${k === today ? `<span class="mk">${d}</span>` : `<span>${d}</span>`}<small>${n ? money(tot[k]).replace(/\.00$/, "") : ""}</small></button>`;
  }
  const mc = checks.filter(c => c.date.startsWith(key)), dc = checks.filter(c => c.date === sel);
  $("#view").innerHTML = `<div class="calwrap">
  <section>
    <div class="calhead"><button class="ghost" data-mv="-1" aria-label="Previous month">&lsaquo;</button><button class="ghost" data-mv="1" aria-label="Next month">&rsaquo;</button>
      <h2>${MONTHS[m]} ${y}</h2><button class="ghost" data-mv="0">Today</button></div>
    <div class="cal head">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<span>${d}</span>`).join("")}</div>
    <div class="cal">${cells}</div>
    <p class="mute" style="margin-top:12px">${plural(mc.length, "receipt")} this month, ${money(sum(mc))}.</p></section>
  <section><h2 style="margin-top:0">${sel}</h2>${dc.length ? dc.map(mini).join("") : '<p class="mute">No receipts on this day.</p>'}</section></div>`;
}

function go(v, animate = true) {
  view = v;
  $("#h1").textContent = TITLES[v][0]; $("#sub").textContent = TITLES[v][1];
  document.querySelectorAll("[data-nav]").forEach(b => { b.classList.toggle("on", b.dataset.nav === v); b.setAttribute("aria-current", b.dataset.nav === v ? "page" : "false"); });
  ({overview: viewOverview, checks: viewChecks, calendar: viewCalendar})[v]();
  if (animate) [...$("#view").children].forEach(el => el.classList.add("fade"));
}

let first = true;
async function load() {
  let r = null;
  try { r = await fetch("/api/checks"); } catch (e) {}
  checks = r && r.ok ? await r.json() : [];
  if (view === "checks" && !first) buildWall(); else go(view, first);
  first = false;
}

document.addEventListener("click", async e => {
  const t = e.target.closest("button,img"); if (!t) return;
  const d = t.dataset;
  if (d.go) go(d.go);
  if (d.day) { sel = d.day; viewCalendar(); }
  if (d.mv !== undefined) {
    if (d.mv === "0") { cal = {y: now.getFullYear(), m: now.getMonth()}; sel = today; }
    else { const x = new Date(cal.y, cal.m + Number(d.mv), 1); cal = {y: x.getFullYear(), m: x.getMonth()}; }
    viewCalendar();
  }
  if (d.side) { $("#viewer img").src = `/api/checks/${d.id}/${d.side}`; $("#viewer").showModal(); }
  if (d.cam) openCam(d.cam);
  if (d.edit) openEdit(d.edit);
  if (d.pkdel && confirm("Remove this passkey? That device won't be able to use it to sign in any more.")) {
    await fetch("/api/passkeys/" + encodeURIComponent(d.pkdel), {method: "DELETE"}); pkLoad();
  }
  if (d.delback && confirm("Delete just the second photo of this receipt? The first photo stays.")) { await fetch(`/api/checks/${d.delback}/back`, {method: "DELETE"}); load(); }
  if (d.del && confirm("Delete this receipt and its photos? This can't be undone.")) { await fetch(`/api/checks/${d.del}`, {method: "DELETE"}); load(); }
  if (t.id === "out") logOut(t);
});

// Log out: play the little door scene, and sign out at the same time. If signing out fails, say so instead of pretending.
async function logOut(btn) {
  if (btn.classList.contains("go")) return;
  btn.classList.add("go"); btn.setAttribute("aria-busy", "true");
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let ok = false;
  try {
    const [r] = await Promise.all([fetch("/logout", {method: "POST"}), new Promise(res => setTimeout(res, calm ? 0 : 1450))]);
    ok = r.ok;
  } catch (e) {}
  if (ok) { location = "/login"; return; }
  btn.classList.remove("go"); btn.removeAttribute("aria-busy");
  alert("Couldn't log out. Check your connection and try again.");
}
$("#viewer").addEventListener("click", () => $("#viewer").close());
let lgTimer = 0;
document.addEventListener("input", e => {
  if (e.target.id === "q") list();
  if (e.target.name === "payee" && e.target.form && e.target.form.id === "form") {  // show the store's logo (or a letter) while you type its name
    clearTimeout(lgTimer);
    lgTimer = setTimeout(() => {
      const p = $("#lg-prev"), name = e.target.value.trim();
      if (!p) return;
      p.hidden = !name; p.classList.remove("has"); p.style.setProperty("--h", hue(name)); p.innerHTML = name ? badgeInner(name) : "";
    }, 350);
  }
});
document.addEventListener("load", e => { if (e.target.classList && e.target.classList.contains("logo")) e.target.parentNode.classList.add("has"); }, true);
document.addEventListener("error", e => { if (e.target.classList && e.target.classList.contains("logo")) e.target.remove(); }, true);

// Gentle warnings before saving. Everything is checked here in the browser against the receipts already loaded.
function warnings(fd, skipId = "") {
  const payee = String(fd.get("payee")).trim().toLowerCase(), amount = Number(fd.get("amount"));
  const date = String(fd.get("date")), num = String(fd.get("check_number")).trim(), out = [];
  const same = checks.filter(c => c.id !== skipId && c.payee.trim().toLowerCase() === payee);
  const dup = same.find(c => (Math.round(c.amount * 100) === Math.round(amount * 100) && c.date === date) || (num && c.check_number === num));
  if (dup) out.push(`Possible duplicate: you already saved a receipt from ${dup.payee} for ${money(dup.amount)} dated ${dup.date}${dup.check_number ? " (#" + dup.check_number + ")" : ""}.`);
  if (same.length >= 3) {
    const v = same.map(c => c.amount).sort((a, b) => a - b), n = v.length;
    const med = n % 2 ? v[(n - 1) / 2] : (v[n / 2 - 1] + v[n / 2]) / 2;
    if (med > 0 && amount > med * 3 && amount - med >= 50)
      out.push(`Unusual total: your ${n} other receipts from ${same[0].payee} are usually about ${money(med)}, and this one is ${money(amount)}.`);
  }
  return out;
}

let editing = "";
function openEdit(id) {
  const c = checks.find(x => x.id === id), f = $("#eform");
  if (!c) return;
  editing = id;
  f.elements.date.value = c.date; f.elements.payee.value = c.payee; f.elements.amount.value = c.amount;
  f.elements.check_number.value = c.check_number || ""; f.elements.memo.value = c.memo || "";
  $("#emsg").textContent = "";
  $("#edit").showModal();
}
$("#ecancel").addEventListener("click", () => $("#edit").close());
async function saveEdit(f) {
  const fd = new FormData(f), msg = $("#emsg"), btn = $("#esave");
  const warn = warnings(fd, editing);
  if (warn.length && !confirm(warn.join("\n\n") + "\n\nSave it anyway?")) { msg.textContent = "Not saved. Fix it and press Save again."; return; }
  btn.disabled = true; msg.textContent = "Saving...";
  try {
    const r = await fetch("/api/checks/" + editing, {method: "PUT", body: fd});
    if (!r.ok) {
      let m = "Please check the fields and try again";
      try { const j = await r.json(); if (typeof j.detail === "string") m = j.detail; }
      catch (x) { m = "The server had a problem (" + r.status + "). Please try again."; }
      throw new Error(m);
    }
    $("#edit").close();
    await load();
  } catch (err) { msg.textContent = "Could not save: " + err.message; }
  btn.disabled = false;
}

document.addEventListener("submit", async e => {
  if (e.target.id === "eform") { e.preventDefault(); saveEdit(e.target); return; }
  if (e.target.id !== "form") return;
  e.preventDefault();
  const f = e.target, fd = new FormData(f), msg = $("#msg"), btn = $("#save");
  if (!fd.get("back").size) fd.delete("back");
  const warn = warnings(fd);
  if (warn.length && !confirm(warn.join("\n\n") + "\n\nSave it anyway?")) { msg.textContent = "Not saved. Fix it and press Save again."; return; }
  btn.disabled = true; msg.textContent = "Encrypting and uploading...";
  try {
    const r = await fetch("/api/checks", {method: "POST", body: fd});
    if (!r.ok) {
      let m = "Please check the fields and try again";
      try { const j = await r.json(); if (typeof j.detail === "string") m = j.detail; }
      catch (e) { m = "The server had a problem (" + r.status + "). Please try again."; }
      throw new Error(m);
    }
    f.reset(); f.elements.date.value = today; $("#lg-prev").hidden = true; $("#ok-front").textContent = ""; $("#ok-back").textContent = ""; msg.textContent = "Receipt saved.";
    await load();
  } catch (err) { msg.textContent = "Could not save: " + err.message; }
  btn.disabled = false;
});

let camTarget = null, stream = null;
async function openCam(name) {
  camTarget = name; $("#camerr").textContent = ""; $("#cam").showModal();
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: "environment"}, width: {ideal: 2000}}, audio: false});
    $("#vid").srcObject = stream;
  } catch (e) { $("#camerr").textContent = "Couldn't open the camera. Allow camera access in your browser, or choose a file instead."; }
}
function stopCam() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } $("#vid").srcObject = null; }
$("#cam").addEventListener("close", stopCam);
$("#camx").addEventListener("click", () => $("#cam").close());
$("#snap").addEventListener("click", () => {
  const v = $("#vid"); if (!v.videoWidth) return;
  const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  c.toBlob(b => {
    const dt = new DataTransfer(); dt.items.add(new File([b], camTarget + ".jpg", {type: "image/jpeg"}));
    $("#form").elements[camTarget].files = dt.files;
    $("#ok-" + camTarget).textContent = "Photo ready \u2713";
    $("#cam").close();
  }, "image/jpeg", 0.9);
});
document.addEventListener("change", e => {
  if (e.target.type === "file") $("#ok-" + e.target.name).textContent = e.target.files.length ? "File chosen \u2713" : "";
});

const toBuf = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0)).buffer;
const toB64u = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const jpost = async (url, body) => {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
  let d = {}; try { d = await r.json(); } catch (e) {}
  return {ok: r.ok, status: r.status, d};
};

async function pkLoad() {
  let d = {enabled: false, items: []};
  try { d = await (await fetch("/api/passkeys")).json(); } catch (e) {}
  $("#pklist").innerHTML = !d.enabled ? '<p class="mute">Passkeys need the site\'s secure address to be set up first.</p>'
    : d.items.length ? d.items.map(p => `<div class="pkrow"><div><b>${esc(p.name)}</b><div class="t-date">Added ${esc(p.added)}${p.used ? ", last used " + esc(p.used) : ""}</div></div><button class="lnk red" data-pkdel="${esc(p.id)}">Remove</button></div>`).join("")
    : '<p class="mute">No passkeys yet.</p>';
  $("#pkadd").disabled = !d.enabled;
}
async function pkAdd() {
  const msg = $("#pkmsg"), btn = $("#pkadd");
  btn.disabled = true; msg.textContent = "Follow the prompt on your device...";
  try {
    const o = await jpost("/api/passkeys/options", {name: $("#pkname").value.trim()});
    if (!o.ok) throw new Error(o.d.detail || "Passkeys aren't available.");
    const p = o.d;
    const cred = await navigator.credentials.create({publicKey: {challenge: toBuf(p.challenge), rp: p.rp, user: {id: toBuf(p.user.id), name: p.user.name, displayName: p.user.displayName},
      pubKeyCredParams: p.pubKeyCredParams, timeout: p.timeout, attestation: "none", authenticatorSelection: p.authenticatorSelection,
      excludeCredentials: p.excludeCredentials.map(c => ({type: c.type, id: toBuf(c.id)}))}});
    const r = cred.response;
    const res = await jpost("/api/passkeys", {cid: p.cid, id: cred.id, response: {clientDataJSON: toB64u(r.clientDataJSON), attestationObject: toB64u(r.attestationObject)}});
    if (!res.ok) throw new Error(res.d.detail || "Could not save it.");
    $("#pkname").value = ""; msg.textContent = "Passkey added."; await pkLoad();
  } catch (e) { msg.textContent = (e.name === "NotAllowedError" || e.name === "AbortError") ? "Cancelled." : "Could not add it: " + (e.message || e.name); }
  btn.disabled = false;
}
$("#pkbtn").hidden = !window.PublicKeyCredential;
$("#pkbtn").addEventListener("click", () => { $("#pkmsg").textContent = ""; $("#pk").showModal(); pkLoad(); });
$("#pkadd").addEventListener("click", pkAdd);
$("#pkclose").addEventListener("click", () => $("#pk").close());

$("#nav").innerHTML = Object.keys(TITLES).map(k => `<button data-go="${k}" data-nav="${k}">${LABEL[k]}</button>`).join("");
$("#h1").textContent = TITLES.overview[0];
const devLabel = () => { if (window.CV) $("#devbtn").textContent = "Layout: " + CV.label() + " (change)"; };
$("#devbtn").addEventListener("click", () => window.CV && CV.ask());
window.addEventListener("cv-device", devLabel); devLabel();
load();
</script>
