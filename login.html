<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in - CheckVault</title>
<style>
:root{--bg:#f5f4ef;--k:1}
@media (prefers-color-scheme:dark){:root{--bg:#111a16}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#150a35;color:#fff;font:16px/1.4 ui-rounded,"SF Pro Rounded","Avenir Next","Segoe UI",system-ui,sans-serif;overflow:hidden}
input,button{font:inherit}
input{min-width:0}
input:focus-visible,button:focus-visible{outline:3px solid #ffd166;outline-offset:2px}

/* colourful moving backdrop */
.bg{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#2a1269 0%,#150a35 70%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6;mix-blend-mode:screen;animation:drift 16s ease-in-out infinite alternate}
.o1{width:60vmax;height:60vmax;left:-18vmax;top:-20vmax;background:#ff3d8b}
.o2{width:55vmax;height:55vmax;right:-18vmax;bottom:-18vmax;background:#12c8e6;animation-delay:-5s}
.o3{width:42vmax;height:42vmax;left:-10vmax;bottom:-16vmax;background:#ffa31a;animation-delay:-9s}
.o4{width:40vmax;height:40vmax;right:-8vmax;top:-14vmax;background:#7c3aed;animation-delay:-3s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(6vmax,4vmax) scale(1.18)}}

form{position:fixed;inset:0;display:grid;place-items:center;margin:0}
.scale{width:480px;height:320px;transform:scale(var(--k))}
.vault{position:relative;width:100%;height:100%;perspective:1400px;animation:enter .95s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(28px) scale(.95)}to{opacity:1;transform:none}}

/* the code screen behind the door */
.interior{position:absolute;inset:0;z-index:1;border-radius:28px;overflow:hidden;display:grid;place-items:center;padding:22px;
  background:radial-gradient(90% 70% at 50% 0%,#2b1b63,#120d2b);border:1px solid rgba(255,255,255,.18);
  visibility:hidden;transition:visibility 0s 1.1s,box-shadow .8s}
.vault.open .interior{visibility:visible;transition-delay:.9s,.9s;
  box-shadow:0 0 70px rgba(255,80,160,.45),0 0 120px rgba(18,200,230,.3)}
.otpbox{display:grid;grid-template-columns:170px 1fr;column-gap:18px;align-items:center;width:100%;opacity:0;transform:translateY(12px) scale(.97);transition:opacity .25s,transform .25s}
.vault.open .otpbox{opacity:1;transform:none;transition:opacity .6s 1.5s,transform .7s 1.5s cubic-bezier(.2,.8,.2,1)}
.txt{display:grid;gap:9px;justify-items:start;text-align:left;min-width:0}
.otpbox h2{margin:0;font-size:1.3rem;font-weight:800}
.otpbox p{margin:0;color:#c9c2ea;font-size:.85rem}

/* the vault door */
.door{position:absolute;inset:0;z-index:2;border-radius:28px;transform-origin:left center;
  display:flex;align-items:center;gap:22px;padding:24px 46px 24px 30px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 6px,rgba(0,0,0,.05) 6px 12px),linear-gradient(150deg,#6d5ce8 0%,#b13fd6 48%,#ff6b8b 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),inset 0 -14px 28px rgba(40,0,80,.4),0 24px 60px rgba(0,0,0,.5);
  transition:transform 1s cubic-bezier(.5,0,.2,1),visibility 0s}
.vault.open .door{transform:rotateY(100deg);visibility:hidden;pointer-events:none;transition:transform 1.1s 1s cubic-bezier(.6,0,.2,1),visibility 0s 2.1s}
.screw{position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#b8862b)}
.s1{left:14px;top:14px}.s2{right:14px;top:14px}.s3{left:14px;bottom:14px}.s4{right:14px;bottom:14px}
.panel{flex:1;display:grid;gap:9px;min-width:0}
.brand{margin:0;font-size:1.7rem;font-weight:800;letter-spacing:-.01em;text-shadow:0 2px 12px rgba(40,0,80,.45)}
.sub{margin:-4px 0 4px;font-size:.88rem;color:#ffeaf4}
.wheel{flex:none;width:116px;height:116px;transition:transform 1s cubic-bezier(.5,0,.2,1);filter:drop-shadow(0 4px 6px rgba(40,0,80,.5))}
.vault.open .wheel{transform:rotate(220deg)}
.field{width:100%;padding:11px 13px;font-size:16px;color:#fff;background:rgba(25,8,60,.5);border:1.5px solid rgba(255,255,255,.3);border-radius:14px}
.field::placeholder{color:#d9cff5}
.field:focus{outline:0;border-color:#ffd166;box-shadow:0 0 0 4px rgba(255,209,102,.28)}
.unlock{width:100%;padding:12px;font-size:16px;font-weight:800;color:#3a1200;border:0;border-radius:14px;cursor:pointer;
  background:linear-gradient(135deg,#ffd166,#ff8a4c);box-shadow:0 6px 0 #b4501f,0 12px 24px rgba(0,0,0,.3);transition:transform .15s,box-shadow .15s}
.unlock:active{transform:translateY(4px);box-shadow:0 2px 0 #b4501f}
.lb{position:absolute;right:-8px;width:30px;height:12px;border-radius:6px;background:linear-gradient(#ffe9a8,#c58a2a);box-shadow:0 1px 3px rgba(0,0,0,.5);transition:transform .4s .7s}
.l1{top:24%}.l2{top:50%;margin-top:-6px}.l3{top:76%}
.vault.open .lb{transform:translateX(-26px);transition-delay:.55s}

/* six-digit phone screen */
.stage{position:relative;width:170px;height:150px}
.phone{--g:#ffb020;--gl:rgba(255,176,32,.55);width:120px;margin:0 auto;transform:scale(.85);transform-origin:top center;filter:drop-shadow(0 0 16px var(--gl));transition:filter .4s}
.phone.verifying{--g:#ff5d8f;--gl:rgba(255,93,143,.8);animation:pulse 1s ease-in-out infinite}
.phone.ok{--g:#3ddc84;--gl:rgba(61,220,132,.75)}
.phone.bad{--g:#ff4d4d;--gl:rgba(255,77,77,.75)}
@keyframes pulse{50%{filter:drop-shadow(0 0 30px var(--gl))}}
.phone svg{display:block;width:120px;height:170px;overflow:visible}
.body{fill:#0f0c22;stroke:var(--g);stroke-width:2.5;transition:stroke .4s}
.screen{fill:#1a1236}
.lk{fill:var(--g);transition:fill .4s}
.sh{fill:none;stroke:var(--g);stroke-width:4;stroke-linecap:round;transform-box:fill-box;transform-origin:left bottom;transition:transform .45s,stroke .4s}
.ok .sh{transform:translateY(-4px) rotate(-28deg)}
.dt{fill:#4a3d6e;transition:fill .2s,opacity .3s}.dt.on{fill:var(--g)}
.ck{fill:none;stroke:var(--g);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .35s}
.ok .ck{opacity:1}.ok .dt{opacity:0}
.bt{fill:var(--g);transition:fill .4s}
.badge{position:absolute;width:30px;height:30px;color:#12c8e6;animation:float 2.6s ease-in-out infinite alternate}
.b1{left:4px;top:104px}.b2{right:4px;top:14px;color:#ff5d8f;animation-delay:-1.3s}
@keyframes float{from{transform:translateY(-5px)}to{transform:translateY(5px)}}
.codes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%}
.codes input{text-align:center;font-size:1.3rem;padding:0;height:46px;width:100%;color:#fff;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.22);border-radius:14px;transition:border-color .3s,box-shadow .3s}
.codes input:focus{outline:0;border-color:#ffd166;box-shadow:0 0 0 4px rgba(255,209,102,.25),0 0 18px rgba(255,209,102,.5)}
form[data-state=verifying] .codes input{border-color:#ff5d8f}
form[data-state=ok] .codes input{border-color:#3ddc84;box-shadow:0 0 12px rgba(61,220,132,.5)}
form[data-state=bad] .codes input{border-color:#ff4d4d}
.codes.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
[hidden]{display:none!important}
.link{background:none;border:0;color:#c9c2ea;cursor:pointer;text-decoration:underline;padding:6px}
.tgbtn,.chip{font:inherit;font-weight:700;border-radius:12px;cursor:pointer}
.tgbtn{font-size:.85rem;padding:8px 14px;border:1.5px solid rgba(18,200,230,.7);background:rgba(18,200,230,.12);color:#8be9fb}
.chip{font-size:1rem;font-weight:800;padding:10px 18px;border:1.5px solid #ffd166;background:rgba(255,209,102,.14);color:#ffd166}
.grp{display:grid;gap:6px;justify-items:start}.who{display:flex;flex-wrap:wrap;gap:8px}
.wait{display:flex;align-items:center;gap:12px}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.2);border-top-color:#ff5d8f;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#err{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 4vh);transform:translateX(-50%);max-width:92vw;margin:0;padding:10px 18px;border-radius:999px;background:rgba(30,6,20,.8);color:#ffc9c9;font-size:.95rem;text-align:center}
#err:empty{display:none}

#wipe{position:fixed;inset:0;background:var(--bg);z-index:20;pointer-events:none;clip-path:circle(0 at var(--x,50%) var(--y,40%));transition:clip-path .85s cubic-bezier(.65,0,.35,1)}
#wipe.go{clip-path:circle(150vmax at var(--x,50%) var(--y,40%))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob o1"></i><i class="blob o2"></i><i class="blob o3"></i><i class="blob o4"></i></div>
<form id="f" method="post" action="/login" novalidate data-state="idle">
  <div class="scale">
    <div class="vault" id="vault">
      <div class="interior">
        <div class="otpbox">
          <div class="stage">
            <svg class="badge b1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>
            <svg class="badge b2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>
            <div class="phone" id="phone" aria-hidden="true">
              <svg viewBox="0 0 120 170">
                <rect class="body" x="8" y="6" width="104" height="158" rx="20"/>
                <rect class="screen" x="16" y="14" width="88" height="142" rx="14"/>
                <rect x="48" y="18" width="24" height="4" rx="2" fill="#000"/>
                <path class="sh" d="M52 64V56a8 8 0 0 1 16 0V64"/>
                <rect class="lk" x="46" y="64" width="28" height="24" rx="5"/>
                <circle cx="60" cy="76" r="3" fill="#1a1236"/>
                <g id="dots"></g>
                <rect class="bt" x="34" y="126" width="52" height="14" rx="5"/>
              </svg>
            </div>
          </div>
          <div class="txt">
          <h2 id="ttl" aria-live="polite">Enter your code</h2>
          <p id="subt">Open your authenticator app and type the 6-digit code. It signs you in as soon as you finish.</p>
          <div class="codes" id="codes" role="group" aria-label="6-digit code"></div>
          <button class="tgbtn" type="button" id="tg">Use Telegram instead</button>
          <div class="grp" id="pick" hidden><div class="who" id="who"></div><button class="link" type="button" id="pickback">Back to code</button></div>
          <div class="wait" id="wait" hidden><i class="spin"></i><button class="link" type="button" id="cancel">Cancel</button></div>
          <button class="link" type="button" id="back">Back</button>
          </div>
        </div>
      </div>
      <div class="door">
        <i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>
        <div class="panel">
          <h1 class="brand">CheckVault</h1>
          <p class="sub">Sign in to open your vault</p>
          <input class="field" name="username" placeholder="Username" aria-label="Username" autocomplete="username" required>
          <input class="field" name="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
          <button class="unlock" type="button" id="next">Unlock</button>
        </div>
        <div class="wheel" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="none" stroke="#fff3c4" stroke-width="6"/><g stroke="#fff3c4" stroke-width="6" stroke-linecap="round"><path d="M50 50V12"/><path d="M50 50L83 69"/><path d="M50 50L17 69"/></g><g fill="#ffd166"><circle cx="50" cy="12" r="6"/><circle cx="83" cy="69" r="6"/><circle cx="17" cy="69" r="6"/></g><circle cx="50" cy="50" r="9" fill="#ff8a4c"/></svg></div>
        <i class="lb l1"></i><i class="lb l2"></i><i class="lb l3"></i>
      </div>
    </div>
  </div>
  <input type="hidden" name="code" id="code">
  <p id="err" role="alert"></p>
</form>
<div id="wipe"></div>
<script>
const $ = id => document.getElementById(id);
const f = $("f"), vault = $("vault"), box = $("codes"), err = $("err"), phone = $("phone");
const delay = ms => new Promise(r => setTimeout(r, ms));
let lastW = 0;
function fit() {
  if (innerWidth === lastW && document.activeElement && document.activeElement.tagName === "INPUT") return;
  lastW = innerWidth;
  const k = Math.max(.5, Math.min(innerWidth * .94 / 480, innerHeight * .9 / 320, 2));
  document.documentElement.style.setProperty("--k", k.toFixed(3));
}
fit(); addEventListener("resize", fit);
const TEXT = {
  idle: ["Enter your code", "Open your authenticator app and type the 6-digit code. It signs you in as soon as you finish."],
  verifying: ["Verifying code...", "Checking your details."],
  ok: ["You're in!", "Opening your vault..."],
  bad: ["That didn't work", "Check your details and try again."]
};
$("dots").innerHTML = [0, 1, 2, 3, 4, 5].map(i => { const x = 32.5 + 11 * i; return `<circle class="dt" cx="${x}" cy="108" r="3"/><path class="ck" d="M${x - 3} 108l2.5 2.5 4-5"/>`; }).join("");
const dots = [...$("dots").querySelectorAll(".dt")];
box.innerHTML = Array.from({length: 6}, (_, i) =>
  `<input inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Digit ${i + 1} of 6" autocomplete="${i ? "off" : "one-time-code"}">`).join("");
const digits = [...box.querySelectorAll("input")];
let busy = false;

function setState(s, detail, title) {
  phone.className = "phone" + (s === "idle" ? "" : " " + s);
  f.dataset.state = s;
  $("ttl").textContent = title || TEXT[s][0];
  $("subt").textContent = detail || TEXT[s][1];
}
function updateDots() { const n = digits.filter(d => d.value).length; dots.forEach((c, i) => c.classList.toggle("on", i < n)); }
const isOpen = () => vault.classList.contains("open");

async function next() {
  if (busy || isOpen()) return;
  if (!f.elements.username.value || !f.elements.password.value) { err.textContent = "Enter your username and password first."; return; }
  busy = true; err.textContent = "";
  f.elements.username.readOnly = f.elements.password.readOnly = true;
  document.activeElement.blur();
  setState("idle");
  vault.classList.add("open");
  await delay(2300);
  busy = false;
  digits[0].focus();
}

async function closeVault() {
  if (busy || !isOpen()) return;
  busy = true; err.textContent = "";
  polling++; view("code");
  digits.forEach(d => d.value = ""); updateDots(); setState("idle");
  vault.classList.remove("open");
  await delay(1300);
  f.elements.username.readOnly = f.elements.password.readOnly = false;
  f.elements.password.focus();
  busy = false;
}

async function enter() {
    setState("ok"); await delay(900);
    const b = phone.getBoundingClientRect(), w = $("wipe");
    const x = ((b.left + b.width / 2) / innerWidth * 100).toFixed(1), y = ((b.top + b.height / 2) / innerHeight * 100).toFixed(1);
    w.style.setProperty("--x", x + "%"); w.style.setProperty("--y", y + "%");
    try { sessionStorage.setItem("cv-enter", x + "," + y); } catch (e) {}
    w.classList.add("go"); await delay(900);
    location = "/";
}

async function send() {
  if (busy) return;
  busy = true; err.textContent = "";
  $("code").value = digits.map(d => d.value).join("");
  digits.forEach(d => d.disabled = true);
  setState("verifying");
  let r = null, msg = "Sign in failed";
  try {
    [r] = await Promise.all([fetch("/login", {method: "POST", body: new FormData(f)}), delay(900)]);
    if (!r.ok) { try { msg = (await r.json()).detail || msg; } catch (e) {} }
  } catch (e) { msg = "Couldn't reach the server. It may be waking up, so try again in a few seconds."; }
  if (r && r.ok) {
    await enter(); return;
  }
  setState("bad", msg); err.textContent = msg;
  box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
  await delay(1400);
  digits.forEach(d => { d.value = ""; d.disabled = false; });
  updateDots(); setState("idle", TEXT.idle[1]); digits[0].focus();
  busy = false;
}

digits.forEach((d, i) => {
  d.addEventListener("input", () => {
    d.value = d.value.replace(/\D/g, "").slice(-1);
    updateDots();
    if (d.value && i < 5) digits[i + 1].focus();
    if (digits.every(x => x.value)) send();
  });
  d.addEventListener("keydown", e => {
    if (e.key === "Backspace" && !d.value && i > 0) { digits[i - 1].value = ""; digits[i - 1].focus(); updateDots(); }
  });
  d.addEventListener("paste", e => {
    const t = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
    if (!t) return;
    e.preventDefault();
    [...t].forEach((c, j) => digits[j].value = c);
    updateDots(); digits[Math.min(t.length, 5)].focus();
    if (t.length === 6) send();
  });
});


/* ---- sign in through a Telegram approval button ---- */
let people = null, polling = 0, lastPoll = "";
const cap = n => n.charAt(0).toUpperCase() + n.slice(1);
function view(v) {
  box.hidden = $("tg").hidden = $("back").hidden = v !== "code";
  $("pick").hidden = v !== "pick"; $("wait").hidden = v !== "wait";
}
async function post(url, fd) {
  const r = await fetch(url, {method: "POST", body: fd});
  let j = {}; try { j = await r.json(); } catch (e) {}
  return {ok: r.ok, j};
}
$("tg").addEventListener("click", async () => {
  if (busy) return;
  err.textContent = "";
  try {
    if (!people) people = (await (await fetch("/login/people")).json()).people;
  } catch (e) { err.textContent = "Couldn't reach the server. Try again."; return; }
  if (!people.length) { err.textContent = "Telegram sign-in isn't set up yet."; return; }
  $("who").innerHTML = "";
  people.forEach(n => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = cap(n);
    b.addEventListener("click", () => ask(n));
    $("who").appendChild(b);
  });
  setState("idle", "Pick who gets the approval message in Telegram.", "Ask on Telegram");
  view("pick");
});
$("pickback").addEventListener("click", () => { view("code"); setState("idle"); });
async function ask(n) {
  if (busy) return;
  busy = true; err.textContent = "";
  const fd = new FormData(f); fd.set("who", n);
  let res;
  try { res = await post("/login/ask", fd); }
  catch (e) { err.textContent = "Couldn't reach the server. Try again."; busy = false; return; }
  if (!res.ok) { err.textContent = res.j.detail || "Something went wrong. Try again."; busy = false; return; }
  setState("verifying", `${cap(n)} got a Telegram message with two buttons. Waiting for "It's me".`, `Waiting for ${cap(n)}`);
  view("wait"); busy = false;
  lastPoll = res.j.poll; poll(res.j.poll, cap(n));
}
async function poll(token, label) {
  const id = ++polling;
  while (id === polling) {
    await delay(2000);
    if (id !== polling) return;
    const fd = new FormData(); fd.set("poll", token);
    let res; try { res = await post("/login/status", fd); } catch (e) { continue; }
    const st = res.j.status;
    if (st === "approved") { polling++; await enter(); return; }
    if (st === "denied" || st === "expired") {
      polling++;
      const denied = st === "denied";
      setState("bad", denied ? `${label} tapped "It's not me". This attempt was logged.` : "No answer in 2 minutes. Try again, or use your code.",
               denied ? "Sign-in denied" : "No answer");
      view("wait"); $("wait").hidden = true;
      await delay(3000);
      view("code"); setState("idle"); digits[0].focus();
      return;
    }
  }
}
$("cancel").addEventListener("click", () => {
  const t = ++polling; const fd = new FormData();
  fd.set("cancel", "1"); fd.set("poll", lastPoll);
  post("/login/status", fd).catch(() => {});
  view("code"); setState("idle");
});

$("next").addEventListener("click", next);
$("back").addEventListener("click", closeVault);
f.addEventListener("submit", e => {
  e.preventDefault();
  if (!isOpen()) next();
  else if (digits.every(d => d.value)) send();
});
window.addEventListener("error", e => { err.textContent = "Page error: " + e.message; });
f.elements.username.focus();
</script>
</body>
</html>
